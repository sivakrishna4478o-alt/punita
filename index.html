<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A letter from Hogwarts 🦉</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120e22;--card:#241a3a;--text:#f6ecd2;--ink:#0d0a18;--gold:#d9ad4e;--acc:#740001;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#efe0b8;--card:#fbf3dc;--text:#2a1c10;--ink:#2a1c10;--gold:#9a6b14;color-scheme:light}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'EB Garamond',Georgia,serif;font-size:1.08rem;background-color:var(--bg);color:var(--text);overflow-x:hidden;
background-image:radial-gradient(circle,rgba(217,173,78,.55) 0 1.5px,transparent 2px),radial-gradient(circle,rgba(217,173,78,.3) 0 1px,transparent 1.5px);background-size:97px 97px,61px 61px;background-position:10px 20px,40px 5px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:12px;padding:10px 16px}
.av{width:44px;height:44px;border-radius:50%;background:var(--acc);border:2px solid var(--gold);display:grid;place-items:center;font-size:1.5rem;flex:none;transition:background .6s}
header b{display:block;font-family:'Cinzel',serif;font-size:1rem;color:var(--gold)}header small{opacity:.85}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#7dff9a;margin-right:5px}
main{max-width:460px;margin:0 auto;padding:16px 14px 90px}
#chat{display:flex;flex-direction:column;gap:10px}
.m{max-width:84%;padding:10px 14px;border:1.5px solid var(--gold);line-height:1.4;animation:pop .25s ease-out;overflow-wrap:anywhere}
.me{background:var(--card);border-radius:16px 16px 16px 4px;align-self:flex-start}
.her{background:var(--acc);color:#fff;border-radius:16px 16px 4px 16px;align-self:flex-end;transition:background .6s}
.frame{align-self:flex-start;width:74%;padding:9px;border-radius:6px;background:linear-gradient(135deg,#f3d27a,#a8741a 45%,#f3d27a);box-shadow:0 6px 16px rgba(0,0,0,.45);animation:pop .3s ease-out}
.frame img{display:block;width:100%;height:270px;object-fit:cover;border:3px solid #3b2508}
.frame span{display:block;text-align:center;font-family:'Cinzel',serif;font-size:.78rem;color:#2a1700;padding-top:6px;letter-spacing:.5px}
.typing{display:flex;gap:5px;padding:14px 16px}.typing i{width:8px;height:8px;border-radius:50%;background:var(--gold);opacity:.5;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:1}}@keyframes pop{from{transform:scale(.93);opacity:0}}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:4px}
button,input{font:inherit}
.chip,.go{background:var(--card);color:var(--text);font-weight:700;border:1.5px solid var(--gold);border-radius:999px;padding:9px 16px;cursor:pointer;box-shadow:0 3px 0 var(--gold);touch-action:manipulation}
.chip:active,.go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--gold)}
.go{background:var(--acc);color:#fff;transition:background .6s,transform .2s}
input{flex:1;min-width:0;padding:10px 14px;border:1.5px solid var(--gold);border-radius:999px;background:var(--card);color:var(--text)}
button:focus-visible,input:focus-visible{outline:3px solid #ffd400;outline-offset:2px}
.card{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:16px;box-shadow:0 6px 16px rgba(0,0,0,.4);animation:pop .3s ease-out;text-align:center}
.card h3{margin:4px 0;font-family:'Cinzel',serif;color:var(--gold);font-size:1.1rem}.card small{display:block;opacity:.85;margin-bottom:8px}
.letter{background:#f4e6bf;color:#3a2410;border-radius:10px;padding:22px 16px;margin-top:10px;border:2px solid #b78b3c;text-align:center}
.letter h3{color:#740001}.seal{width:70px;height:70px;border-radius:50%;margin:10px auto;background:radial-gradient(circle at 35% 30%,#b3262a,#600);display:grid;place-items:center;font-size:2rem;color:#ffd98a;box-shadow:0 4px 8px rgba(0,0,0,.4)}
.owl{font-size:3.2rem;display:inline-block;animation:fly 3s ease-in-out infinite}@keyframes fly{50%{transform:translateY(-8px) rotate(6deg)}}
.pr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:inherit;border:1.5px dashed var(--gold);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
.pr b{flex:none;width:26px;height:26px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:1rem;color:#fff}
.pr.on{background:rgba(217,173,78,.15);border-style:solid}.pr.on b{background:var(--acc)}
.cert{text-align:center;border:3px double var(--gold);border-radius:14px;padding:20px 14px;background:#f4e6bf;color:#3a2410;animation:pop .4s ease-out}
.cert h3{margin:6px 0;font-family:'Cinzel',serif;font-size:1.2rem;color:#740001}.cert .nm{font-family:'Cinzel',serif;font-size:1.6rem;margin:6px 0;font-weight:800}.cert p{margin:6px 0;line-height:1.4}
.fall{position:fixed;top:-40px;font-size:1.7rem;pointer-events:none;animation:fall linear forwards;z-index:20}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.owl,.m,.card,.cert,.frame{animation:none}.fall{display:none}}
</style></head><body>
<header><div class="av" id="av" aria-hidden="true">🎩</div><div><b>The Sorting Hat</b><small><span class="dot"></span>awake, just for you</small></div></header>
